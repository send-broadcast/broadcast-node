# Operations this SDK implements dynamically, which a static source scan cannot
# see. Consumed by `rake openapi:coverage` in the broadcast repo.
#
# The 18 migration collections are generated by a loop over COLLECTIONS in
# src/resources/migration.ts, so the path never appears as a literal.

dynamic_operations:
  - GET /api/migration/v1/channels
  - GET /api/migration/v1/subscribers
  - GET /api/migration/v1/templates
  - GET /api/migration/v1/segments
  - GET /api/migration/v1/sequences
  - GET /api/migration/v1/email_servers
  - GET /api/migration/v1/opt_in_forms
  - GET /api/migration/v1/broadcasts
  - GET /api/migration/v1/outbound_receipts
  - GET /api/migration/v1/webhook_endpoints
  - GET /api/migration/v1/tokens
  - GET /api/migration/v1/suppressions
  - GET /api/migration/v1/tags
  - GET /api/migration/v1/users
  - GET /api/migration/v1/link_redirects
  - GET /api/migration/v1/link_clicks
  - GET /api/migration/v1/subscriber_histories
  - GET /api/migration/v1/file_assets
